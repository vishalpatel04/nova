name: NOVA
options:
  bundleIdPrefix: com.nova
  deploymentTarget:
    iOS: "17.0"
targets:
  NOVA:
    type: application
    platform: iOS
    sources:
      - NOVA
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nova.ios
      INFOPLIST_FILE: NOVA/Info.plist
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: NOVA/Info.plist
